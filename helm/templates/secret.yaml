apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kutcut-api.secretName" . }}
  labels:
    {{- include "kutcut-api.labels" . | nindent 4 }}
type: Opaque
data:
  # -------------------------------------------------------
  # ASP.NET Core reads configuration from environment
  # variables using the __ (double underscore) separator
  # to represent nested keys. These env var names map
  # directly to the appsettings.json structure.
  # -------------------------------------------------------

  # Database
  ConnectionStrings__PostgresConnectionString: {{ .Values.secret.postgresConnectionString | b64enc | quote }}

  # JWT Authentication
  JwtSettings__SecretKey: {{ .Values.secret.jwtSecretKey | b64enc | quote }}

  # RabbitMQ credentials
  RabbitMQ__UserName: {{ .Values.secret.rabbitmqUserName | b64enc | quote }}
  RabbitMQ__Password: {{ .Values.secret.rabbitmqPassword | b64enc | quote }}

  # Email (Gmail SMTP)
  EmailSettings__UserName: {{ .Values.secret.emailUserName | b64enc | quote }}
  EmailSettings__Password: {{ .Values.secret.emailPassword | b64enc | quote }}

  # Azure Blob Storage
  AzureBlobStorage__ConnectionString: {{ .Values.secret.azureBlobConnectionString | b64enc | quote }}

  # External Auth Service
  AuthService__BaseUrl: {{ .Values.secret.authServiceBaseUrl | b64enc | quote }}
