# ============================================================
# KutCut API — Helm Values
# Sensitive values (secret.*) must be supplied at deploy time:
#   helm upgrade --install kutcut-api ./helm \
#     --set secret.postgresConnectionString="Host=..." \
#     --set secret.jwtSecretKey="..."
# ============================================================

replicaCount: 1

image:
  repository: acrkutcutpostech.azurecr.io/kutcut-api
  tag: latest
  migratorTag: latest-migrator
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
  host: "kutcut.example.com"

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

# Non-sensitive configuration (ConfigMap)
config:
  aspnetcoreEnvironment: "Production"
  rabbitmq:
    hostName: "rabbitmq-rabbitmq-custom"
    port: "5672"
    videoProcessingQueueName: "processamento_de_videos"
    videoUploadedQueueName: "video_uploaded"
  emailSettings:
    smtpServer: "smtp.gmail.com"
    port: "587"
    fromEmail: "kutcut.videos@gmail.com"
    fromName: "KutCut Platform"
  azureBlobStorage:
    containerName: "kutcut"
  authService:
    timeoutSeconds: "30"
  postgres:
    host: "psql-kutcut-postech.postgres.database.azure.com"
    db: "kutcut"
    port: "5432"

# Sensitive configuration (Secret) — leave empty, set at deploy time
secret:
  postgresConnectionString: ""
  jwtSecretKey: ""
  rabbitmqUserName: ""
  rabbitmqPassword: ""
  emailUserName: ""
  emailPassword: ""
  azureBlobConnectionString: ""
  authServiceBaseUrl: ""
  postgresUser: ""
  postgresPassword: ""

# Key Vault Integration (Workload Identity)
keyVault:
  enabled: true
  name: "kv-kutcut-0655d655"
  tenantId: "09d5a929-8c74-463b-bf47-678505201104"
  clientId: "a0ba8d0d-8fe5-476f-97f6-aabb7ebff91d" # Managed Identity Client ID
  
migrator:
  enabled: true
  image:
    repository: acrkutcutpostech.azurecr.io/kutcut/migrator-kutcut
    tag: latest-migrator