name: CD - Deploy FastFood to AKS

on:
  push:
    branches:
      - main
      - CD/CI
  workflow_dispatch:

env:
  REGISTRY: acrkutcutpostech.azurecr.io
  APP_IMAGE_NAME: kutcut/api
  CHART_PATH: ./helm
  RELEASE_NAME: kutcut-api-release
  AKS_RESOURCE_GROUP: rg-kutcut-postech
  AKS_CLUSTER_NAME: aks-kutcut-postech
  NAMESPACE: kutcut

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Login no Azure (OIDC)
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_KAUAN }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_KAUAN }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_KAUAN }}
      # 2. Login no ACR
      - name: Azure Container Registry Login
        run: az acr login --name acrkutcutpostech

      # 3. Build e Push da imagem (Versionamento SHA + Latest)
      - name: Build and push Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$APP_IMAGE_NAME:$IMAGE_TAG -t $REGISTRY/$APP_IMAGE_NAME:latest .
          docker build --target migrator -t $REGISTRY/kutcut/migrator-kutcut:latest-migrator .   

          docker push $REGISTRY/$APP_IMAGE_NAME:$IMAGE_TAG
          docker push $REGISTRY/$APP_IMAGE_NAME:latest
          docker push $REGISTRY/kutcut/migrator-kutcut:latest-migrator

      # 4. Conectar no AKS
      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group $AKS_RESOURCE_GROUP \
            --name $AKS_CLUSTER_NAME \
            --overwrite-existing \
            --admin

      # 5. Setup Helm
      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.15.1

      # 6. Validação do Chart (Segurança extra antes de aplicar)
      - name: Helm Lint
        run: helm lint $CHART_PATH

      - name: Create Namespace
        run: kubectl create namespace $NAMESPACE --dry-run=client -o yaml | kubectl apply -f -
      - name: Create ACR Secret
        run: |
          kubectl create secret docker-registry acr-secret \
            --docker-server=$REGISTRY \
            --docker-username=$(az acr credential show --name acrkutcutpostech --query "username" -o tsv) \
            --docker-password=$(az acr credential show --name acrkutcutpostech --query "passwords[0].value" -o tsv) \
            --namespace $NAMESPACE \
            --dry-run=client -o yaml | kubectl apply -f -

      # 7. Executar Migration Job
      - name: Run Database Migration
        run: |
          echo "🧹 Limpando jobs anteriores..."
          kubectl delete jobs -l app=kutcut-migrations -n $NAMESPACE --ignore-not-found=true
          
          echo "🚀 Renderizando e aplicando Job de Migração..."
          helm template migrator-job $CHART_PATH \
            --namespace $NAMESPACE \
            --set keyVault.clientId="${{ secrets.AZURE_CLIENT_ID_KAUAN }}" \
            --set keyVault.tenantId="${{ secrets.AZURE_TENANT_ID_KAUAN }}" \
            --show-only templates/migrator-job.yaml \
            --show-only templates/configmap.yaml \
            --show-only templates/serviceaccount-migrator.yaml \
            --show-only templates/secretproviderclass.yaml | kubectl apply -f -
          
          echo "⏳ Aguardando migração finalizar..."
          kubectl wait --for=condition=complete job -l app=migrator-kutcut -n $NAMESPACE --timeout=300s
        
      - name: Deploy Application with Migration
        run: |
          echo "🧹 Limpando resquícios para evitar conflitos de posse..."
          # Deleta o Job e SA
          kubectl delete job -l app=migrator-kutcut -n $NAMESPACE --ignore-not-found=true
          kubectl delete sa migrator-job -n $NAMESPACE --ignore-not-found=true
          
          # DESTREVA O HELM: Deleta segredos de release que não terminaram com sucesso
          echo "🔓 Destravando o Helm..."
          kubectl delete secret -l owner=helm,name=$RELEASE_NAME,status=pending-install -n $NAMESPACE --ignore-not-found=true
          kubectl delete secret -l owner=helm,name=$RELEASE_NAME,status=pending-upgrade -n $NAMESPACE --ignore-not-found=true
          
          echo "🚀 Rodando Helm Upgrade (Migração + API)..."
          helm upgrade --install $RELEASE_NAME $CHART_PATH \
            --namespace $NAMESPACE \
            --set keyVault.clientId="${{ secrets.AZURE_CLIENT_ID_KAUAN }}" \
            --set keyVault.tenantId="${{ secrets.AZURE_TENANT_ID_KAUAN }}" \
            --atomic --cleanup-on-fail --wait --timeout 5m